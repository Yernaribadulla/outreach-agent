name: Checks
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: outreach-agent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python -m compileall -q app tests
      - run: python -m unittest discover -s tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --check script.js
      - run: node --check js/content.js
      - run: node --check js/dialogs.js
      - run: node --check js/booking.js
      - run: node --check outreach-agent/app/ui/review.js
      - run: git diff --check
